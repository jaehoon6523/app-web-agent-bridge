name: Bridge gates

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:platform
      - run: npm run test:platform:browser
      - run: npm run test:e2e:ci
      - if: runner.os == 'Linux'
        run: npm run test:ui
      - if: runner.os == 'Linux'
        run: npm run test:browser
      - if: runner.os == 'Linux'
        run: npm run test:sabotage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ matrix.os }}
          path: .agent-controller/ui-qa/
          if-no-files-found: ignore
