name: Bridge gates
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22.14.0', '24']
    runs-on: ${{ matrix.os }}
    # Sequential coverage replaces several jobs; per-test deadlines are unchanged.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Dependencies and browser preparation are catalog stages. Their failures
      # are recorded before dependent stages become NOT_RUN.
      - run: npm run verify:all
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-${{ matrix.os }}-${{ matrix.node }}
          path: |
            .agent-controller/latest-verification.*
            .agent-controller/verification-runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  minimum-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.5.0'
          cache: npm
      - run: npm run verify:all -- --scope=minimum
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-minimum
          path: |
            .agent-controller/latest-verification.*
            .agent-controller/verification-runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
