<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLI 구현 · 웹 감사</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top"><strong>CLI 구현 · 웹 감사</strong><div class="signals"><span id="serverSignal">서버 · 확인 전</span><span id="cliSignal">CLI · 확인 전</span><span id="webSignal">웹 · 확인 전</span><span id="refreshSignal">런 · 확인 전</span></div></header>
<div class="layout">
  <aside class="history"><h2>실행 기록</h2><button id="newRun">새 작업</button><p id="newRunReason" class="muted"></p><nav id="runList" aria-label="실행 선택"></nav></aside>
  <main>
    <p id="connectionNotice" role="status">로컬 서버에 연결하고 있습니다.</p>
    <section id="startPanel"><p class="eyebrow">구현 → 감사 → 수정 → 재감사</p><h1>무엇을 구현할까요?</h1>
      <form id="startForm"><label for="objective">작업 목표</label><textarea id="objective" rows="4" required placeholder="필수 기능과 원하는 결과를 적어 주세요."></textarea>
        <label for="conversationUrl">ChatGPT 대화 URL</label><input id="conversationUrl" type="url" required placeholder="https://chatgpt.com/c/…">
        <p class="muted">브릿지 확장이 연결된 브라우저에서 이 대화의 탭을 하나만 열어 주세요.</p>
        <details open><summary>대상 프로젝트 · 감사 기준</summary><div id="projectSummary"></div></details>
        <button id="startRun" class="primary" disabled>구현·감사 시작</button><p id="startReason" class="muted"></p>
      </form>
    </section>
    <section id="runPanel" hidden><div class="run-header"><p id="runContext" class="eyebrow"></p><h1 id="runObjective"></h1><strong id="runStatus"></strong><p id="runReason"></p><p id="runTime" class="muted"></p></div>
      <details id="intervention"><summary>개입 · 결과 확인</summary><div class="actions"><button id="stopRun" disabled>작업 중단</button><button id="applyCode" disabled>감사 통과 후보 적용</button><button id="exportEvidence" disabled>감사 기록 다운로드</button></div><p id="commandReason" class="muted"></p><p id="commandResult" role="status"></p><p class="muted">일시정지·재개·재시도·실행 중 자유입력은 초기 범위에서 보류되어 있습니다.</p></details>
      <div class="tabs" role="group" aria-label="기록 종류"><button id="showAudit" aria-pressed="true">감사 지적·근거</button><button id="showLog" aria-pressed="false">진행 기록</button></div>
      <section id="auditPanel"><h2>요구사항별 판정</h2><div id="assessments"></div><h2>감사 지적과 해결 이력</h2><div id="findings"></div><h2>후보·검증 증거</h2><div id="evidenceList"></div><details><summary>고정 기준과 후보 상세</summary><pre id="candidateDetails"></pre></details></section>
      <section id="logPanel" hidden><div id="eventLog" role="log" aria-label="실제 진행 기록"></div></section>
    </section>
  </main>
</div>
<dialog id="evidenceDialog"><button id="closeEvidence">닫기</button><h2 id="evidenceTitle">증거 원문</h2><pre id="evidenceContent"></pre><p id="evidenceRange" class="muted"></p><button id="nextEvidence">다음 구간</button></dialog>
<script type="module" src="app.js"></script>
</body></html>
