<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Web Agent Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <strong>ChatGPT Web Agent Bridge</strong>
        <span id="status" class="badge">checking</span>
      </header>
      <label>
        Controller WebSocket
        <input id="controllerUrl" type="text" spellcheck="false" />
      </label>
      <label>
        Shared secret
        <input id="sharedSecret" type="password" spellcheck="false" autocomplete="off" />
      </label>
      <p id="detail"></p>
      <div class="actions">
        <button id="save" type="button">Save & reconnect</button>
        <button id="reconnect" type="button" class="secondary">Reconnect</button>
      </div>
      <button id="openController" type="button" class="secondary">컨트롤러에서 해당 작업 확인</button>
      <section>
        <h2>에이전트 진단 로그</h2><button id="exportAgentDiagnostics" type="button" class="secondary">최신 로그 저장</button>
        <p id="agentDiagnosticStatus">오류 원인·현재 상태·확인 불가 항목을 파일 하나로 내보냅니다.</p>
      </section>
      <section>
        <h2>ChatGPT 탭 진단</h2>
        <button id="inspectTabs" type="button" class="secondary">모든 탭 상태 다시 확인</button>
        <label>확인할 탭<select id="diagnosticTab"></select></label>
        <button id="openDiagnosticTab" type="button" class="secondary" disabled>선택한 탭 열기</button>
        <p id="tabDiagnosticDetail">탭별 입력창과 콘텐츠 버전을 확인합니다. 탭을 열어도 전송 소유권은 바뀌지 않습니다.</p>
      </section>
      <section id="deliveryRecovery" hidden>
        <h2>미확인 전송</h2>
        <label id="scopedRecovery" hidden>다른 세션의 전송<select id="deliveryScope"></select></label><button id="selectDelivery" type="button" hidden>이 전송 확인</button>
        <div class="actions">
          <button id="inspectDelivery" type="button">전송 상태 확인</button>
          <button id="openDelivery" type="button" class="secondary" disabled>대화 확인</button>
        </div>
        <p id="recoveryDetail">상태 확인 후 해당 작업의 복구·폐기 경로를 확인하세요.</p>
        <label><input id="serverMissingConfirmed" type="checkbox" /> 서버에 대응 전송 기록이 없음을 확인했습니다.</label>
        <label><input id="unresolvedConfirmed" type="checkbox" /> 원래 전송 결과가 미확정이거나 처리되지 않았음을 확인했습니다.</label>
        <label><input id="noResendConfirmed" type="checkbox" /> 원래 요청을 자동 재전송하지 않습니다.</label>
        <label><input id="pageUnconfirmed" type="checkbox" /> 페이지에 접근할 수 없으면 생성 종료도 확인할 수 없음을 이해했습니다.</label>
        <label>폐기 사유<input id="discardReason" type="text" /></label>
        <button id="discardOrphan" type="button" class="secondary" disabled>확장에만 남은 전송 폐기</button>
      </section>
      <div id="legacyRecovery" hidden>
        <p>수동 브릿지 테스트가 남긴 synthetic 전송 상태가 확인됐습니다.</p>
        <button id="clearLegacy" type="button" class="secondary">테스트 전송 상태 삭제</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
